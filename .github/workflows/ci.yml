name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # 22.5 is the floor: the store uses node:sqlite from the standard
          # library rather than a native driver, so there is no compiled addon
          # to rebuild against each Electron ABI. 24 is the current LTS.
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm build
