name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # 22.5 is the floor: the store uses node:sqlite from the standard
          # library rather than a native driver, so there is no compiled addon
          # to rebuild against each Electron ABI. 24 is the current LTS.
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        env:
          # Electron ships a ~138 MB platform zip from a postinstall hook. CI
          # typechecks the shell and bundles it in this Linux job — and the
          # TypeScript definitions live in the npm package itself, not in the
          # binary. Skipping the download keeps the dependency's CI cost close to
          # zero. The Windows `shell-smoke` job below downloads and launches the
          # real binary, so a release cannot rely on bundling alone.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: pnpm verify

      # Bundling is where the shell's build constraints are enforced — a CJS,
      # self-contained preload for `sandbox: true` above all. esbuild needs no
      # Electron binary, so this costs seconds and catches a regression that
      # would otherwise only appear on someone's desktop.
      - run: pnpm build:shell

      - run: pnpm build

  shell-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Installed-shell evidence gate: real Electron, preload bridge, Windows
      # data directory and detached runner.
      - run: pnpm verify:shell
